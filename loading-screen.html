<div id="pixel-launch-loader" role="dialog" aria-label="Pixel Arcade loading" aria-labelledby="pixel-launch-title">
  <div class="pixel-launch-glow" aria-hidden="true"></div>
  <div class="pixel-launch-wrap">
    <header class="pixel-launch-header">
      <span class="pixel-launch-brand"><span class="pixel-launch-mark" aria-hidden="true">◈</span> PIXEL ARCADE</span>
      <span class="pixel-launch-tag"><span class="pixel-launch-pulse" aria-hidden="true"></span> INITIALIZING</span>
    </header>
    <section class="pixel-launch-card">
      <div class="pixel-launch-orb" aria-hidden="true"><div class="pixel-launch-spinner"></div><span>✦</span></div>
      <p class="pixel-launch-kicker">SYSTEM / ARCADE</p>
      <h1 id="pixel-launch-title">Preparing your next adventure<span class="pixel-launch-ellipsis" aria-hidden="true">...</span></h1>
      <p class="pixel-launch-subtitle">Getting your gaming space ready.</p>
      <div class="pixel-launch-progress" aria-hidden="true"><span></span></div>
      <div class="pixel-launch-console" aria-live="polite">
        <div><span class="pixel-launch-chevron">›</span><span class="pixel-launch-log-1">Initializing Pixel Arcade interface</span><span class="pixel-launch-check" aria-hidden="true">✓</span></div>
        <div><span class="pixel-launch-chevron">›</span><span class="pixel-launch-log-2">Loading the arcade experience</span><span class="pixel-launch-check" aria-hidden="true">✓</span></div>
        <div><span class="pixel-launch-chevron">›</span><span class="pixel-launch-log-3">Waiting for the page to be ready</span><span class="pixel-launch-check" aria-hidden="true">✓</span></div>
      </div>
      <div class="pixel-launch-foot"><span id="pixel-launch-status">STARTING UP</span><button id="pixel-launch-skip" type="button">Skip intro <span aria-hidden="true">↗</span></button></div>
    </section>
    <p class="pixel-launch-bottom">INSERT FUN. PRESS PLAY. <span aria-hidden="true">✦</span></p>
  </div>
</div>
